<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4cbe">
<meta name="description" content="Je borden, lijsten en kaarten om je werk te plannen.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planbord">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>Planbord</title>
<style>
/* Layout: topbar, then a work area with optional side panels (Inbox, Planner) next to a horizontally scrolling board; dock pinned at the bottom. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, "Helvetica Neue", Arial, sans-serif;
  --bg:#ffffff; --fg:#172b4d; --muted:#626f86; --subtle:#8590a2;
  --top-bg:#ffffff; --border:#dcdfe4; --hover:rgba(9,30,66,.08); --hover-strong:rgba(9,30,66,.14);
  --accent:#0c66e4; --accent-fg:#ffffff; --accent-soft:#e9f2ff;
  --panel-bg:linear-gradient(180deg,#e9f2ff 0%,#f4f0ff 100%); --panel-solid:#eef2fb;
  --list-bg:#f1f2f4; --card-bg:#ffffff; --card-shadow:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);
  --modal-bg:#ffffff; --pop-bg:#ffffff; --input-bg:#ffffff; --field-bg:#f7f8f9;
  --shadow-lg:0 8px 12px rgba(9,30,66,.15),0 0 1px rgba(9,30,66,.31);
  --ok:#1f845a; --ok-bg:#dcfff1; --done-bg:#dcfff1; --warn-bg:#f8e6a0; --warn-fg:#533f04; --late-bg:#ffd5d2; --late-fg:#ae2e24;
  --lc-none:var(--list-bg); --lc-yellow:#f8e6a0; --lc-green:#baf3db; --lc-blue:#cce0ff; --lc-purple:#dfd8fd; --lc-red:#ffd5d2; --lc-orange:#fedec8; --lc-teal:#c6edfb; --lc-pink:#fdd0ec;
  --lb-green:#4bce97; --lb-yellow:#f5cd47; --lb-orange:#fea362; --lb-red:#f87168; --lb-purple:#9f8fef; --lb-blue:#579dff; --lb-sky:#6cc3e0; --lb-pink:#e774bb;
  --lb-fg:#172b4d; --avatar:#0c66e4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1d2125; --fg:#b6c2cf; --muted:#9fadbc; --subtle:#8c9bab;
  --top-bg:#1d2125; --border:#38414a; --hover:rgba(255,255,255,.08); --hover-strong:rgba(255,255,255,.14);
  --accent:#579dff; --accent-fg:#1d2125; --accent-soft:#1c2b41;
  --panel-bg:linear-gradient(180deg,#1c2b41 0%,#231f3a 100%); --panel-solid:#1f2a3a;
  --list-bg:#101204; --card-bg:#22272b; --card-shadow:0 1px 1px rgba(0,0,0,.5),0 0 1px rgba(0,0,0,.5);
  --modal-bg:#323940; --pop-bg:#282e33; --input-bg:#22272b; --field-bg:#2c333a;
  --shadow-lg:0 8px 12px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.5);
  --ok:#4bce97; --ok-bg:#164b35; --done-bg:#1c3329; --warn-bg:#533f04; --warn-fg:#f8e6a0; --late-bg:#5d1f1a; --late-fg:#ffd5d2;
  --lc-yellow:#4a3c0b; --lc-green:#164b35; --lc-blue:#09326c; --lc-purple:#352c63; --lc-red:#5d1f1a; --lc-orange:#5f3811; --lc-teal:#164555; --lc-pink:#50253f;
  --lb-fg:#1d2125; --avatar:#579dff; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1d2125; --fg:#b6c2cf; --muted:#9fadbc; --subtle:#8c9bab;
  --top-bg:#1d2125; --border:#38414a; --hover:rgba(255,255,255,.08); --hover-strong:rgba(255,255,255,.14);
  --accent:#579dff; --accent-fg:#1d2125; --accent-soft:#1c2b41;
  --panel-bg:linear-gradient(180deg,#1c2b41 0%,#231f3a 100%); --panel-solid:#1f2a3a;
  --list-bg:#101204; --card-bg:#22272b; --card-shadow:0 1px 1px rgba(0,0,0,.5),0 0 1px rgba(0,0,0,.5);
  --modal-bg:#323940; --pop-bg:#282e33; --input-bg:#22272b; --field-bg:#2c333a;
  --shadow-lg:0 8px 12px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.5);
  --ok:#4bce97; --ok-bg:#164b35; --done-bg:#1c3329; --warn-bg:#533f04; --warn-fg:#f8e6a0; --late-bg:#5d1f1a; --late-fg:#ffd5d2;
  --lc-yellow:#4a3c0b; --lc-green:#164b35; --lc-blue:#09326c; --lc-purple:#352c63; --lc-red:#5d1f1a; --lc-orange:#5f3811; --lc-teal:#164555; --lc-pink:#50253f;
  --lb-fg:#1d2125; --avatar:#579dff; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.43;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
#app{height:100%;display:flex;flex-direction:column}

/* Topbar */
.top{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--top-bg);border-bottom:1px solid var(--border);flex:none}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;color:var(--muted);padding:4px 6px;border-radius:4px}
.logo-mark{width:22px;height:22px;border-radius:4px;background:var(--accent);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:4px}
.logo-mark i{background:var(--accent-fg);border-radius:1px}
.logo-mark i:last-child{height:60%}
.search{flex:1;max-width:780px;margin-inline:auto;position:relative;min-width:0}
.search input{width:100%;height:32px;border:1px solid var(--border);border-radius:6px;padding:0 10px 0 32px;background:var(--input-bg)}
.search .ic{position:absolute;left:10px;top:8px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;font-weight:500;background:var(--hover);white-space:nowrap}
.btn:hover{background:var(--hover-strong)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:#c9372c;color:#fff}
.btn.sm{height:28px;padding:0 10px}
.pick-split{width:28px;height:28px;flex:none;border-radius:4px;display:grid;place-items:center;color:var(--muted)}
.pick-split:hover{background:var(--hover-strong);color:var(--fg)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.icon-btn:hover{background:var(--hover)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--avatar);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.avatar.sm{width:24px;height:24px;font-size:10px}

.grip{flex:none;display:grid;place-items:center;width:14px;height:20px;cursor:grab;color:var(--muted);opacity:.35;touch-action:none;border-radius:3px}
.ci:hover .grip,.qs-row:hover .grip,.grip:focus-visible{opacity:1}
.grip:hover{background:var(--hover-strong)}
.sorting{background:var(--card-bg)!important;box-shadow:var(--shadow-lg);position:relative;z-index:2}
body.sorting-steps,body.sorting-steps *{cursor:grabbing!important;user-select:none}

/* Finished cards: green tint and faded until hovered, so they read as done before archiving */
.card.finished{background:var(--done-bg);opacity:.62}
.card.finished .card-title-text{text-decoration:line-through;text-decoration-color:var(--ok)}
.card.finished:hover,.card.finished:focus-within{opacity:1}
.ghost.finished{opacity:.95}

/* List layouts: side by side (default), grid with several rows, or stacked */
.lists.layout-raster{flex-wrap:wrap;overflow-y:auto;overflow-x:hidden;align-content:flex-start}
.lists.layout-kolom{flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden}
.lists.layout-raster .list,.lists.layout-kolom .list{max-height:none}
.lists.layout-raster .cards,.lists.layout-kolom .cards{overflow:visible}
.lists.layout-kolom .list,.lists.layout-kolom .add-list,.lists.layout-kolom .ph-list{width:auto;max-width:760px}
.lists.layout-kolom .list.collapsed{flex-direction:row;padding:10px 12px;width:auto}
.lists.layout-kolom .list.collapsed .vtitle{writing-mode:horizontal-tb;flex:1}
.lists.layout-raster .ph-list,.lists.layout-kolom .ph-list{align-self:flex-start}
.layout-opt{display:flex;align-items:center;gap:10px;width:calc(100% + 24px);margin:0 -12px;padding:8px 12px;text-align:left}
.layout-opt:hover{background:var(--hover)}
.layout-opt.on{color:var(--accent);font-weight:600}
.layout-opt small{display:block;color:var(--muted);font-weight:400;font-size:12px}

.own-color{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;background:var(--hover)}
.own-color:hover{background:var(--hover-strong)}
.own-color input{width:32px;height:24px;padding:0;border:0;background:none;cursor:pointer}
.own-color i{width:20px;height:20px;border-radius:4px;margin-left:auto}
.lbl-color{width:40px;height:28px;border-radius:4px;flex:none}
.lbl-color:hover{filter:brightness(.9)}
.list.ink-light>.list-head,.list.ink-light>.list-foot,.list.ink-light.collapsed{color:#fff;--muted:rgba(255,255,255,.8);--hover:rgba(255,255,255,.16)}
.card{color:var(--fg)}

/* Archive box */
.archive-box{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;border:1px dashed var(--border);color:var(--muted);font-weight:500;transition:background .15s,transform .15s}
.archive-box:hover{background:var(--hover);color:var(--fg)}
.archive-box.drop-on{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);transform:scale(1.08)}
body.dragging .archive-box{border-color:var(--accent);color:var(--accent)}
.arch-count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--hover-strong);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.arch-count:empty{display:none}
.pop.wide{width:400px}
.arch-page{position:absolute;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;min-height:0}
.ap-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px 10px;border-bottom:1px solid var(--border)}
.ap-head h2{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
.ap-head h2 small{font-size:13px;font-weight:500;color:var(--muted)}
.ap-head .field{width:220px;max-width:100%;margin:0}
.ap-head select.field{width:auto}
.ap-head .sp{flex:1}
.ap-body{flex:1;overflow-y:auto;padding:4px 20px 96px}
.ap-day{margin-top:14px}
.ap-day h3{position:sticky;top:0;z-index:1;background:var(--bg);margin:0;padding:10px 0 8px;font-size:15px;display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--border)}
.ap-day h3 span{font-size:13px;font-weight:500;color:var(--muted)}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding-top:10px}
.ap-tile{background:var(--card-bg);box-shadow:var(--card-shadow);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ap-tile.finished{background:var(--done-bg)}
.ap-tile .lbls{display:flex;flex-wrap:wrap;gap:4px}
.ap-tile .lbl{height:8px;min-width:40px;border-radius:4px}
.ap-tile b{font-weight:600;overflow-wrap:anywhere;cursor:pointer;display:flex;gap:6px;align-items:flex-start}
.ap-tile b:hover{text-decoration:underline}
.ap-tile b .ic{flex:none;margin-top:2px;color:var(--ok)}
.ap-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.ap-acts{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:4px}
.ap-acts .icon-btn{width:28px;height:28px;margin-left:auto}
.ap-kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ap-empty{color:var(--muted);text-align:center;padding:60px 20px}
.archive-box.on{background:var(--accent-soft);color:var(--accent);border-style:solid;border-color:var(--accent)}
@media (max-width:700px){.ap-head{padding:10px 12px}.ap-body{padding:4px 12px 96px}.ap-head .sp{display:none}.ap-head [data-act=closeArchive]{order:1;margin-left:auto}.ap-head select.field{order:2;flex:1}.ap-head #archSearch{order:3;width:100%}}
.arch-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.arch-row .grow{flex:1;min-width:0}
.arch-row .grow b{display:block;font-weight:600;overflow-wrap:anywhere;cursor:pointer}
.arch-row .grow span{font-size:12px;color:var(--muted)}
.arch-row .icon-btn{width:28px;height:28px}

/* Work area */
.work{flex:1;display:flex;gap:8px;padding:8px;min-height:0;position:relative}
.panel{width:280px;flex:none;border-radius:12px;background:var(--panel-bg);display:flex;flex-direction:column;min-height:0;box-shadow:0 0 0 1px var(--border)}
.panel-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px;font-weight:700;font-size:16px}
.panel-head .grow{flex:1}
.panel-body{flex:1;overflow-y:auto;padding:0 8px 8px;min-height:0}
.panel-foot{padding:10px 16px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.inbox-add{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 12px;background:var(--input-bg);box-shadow:var(--card-shadow);resize:none}
.inbox-empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:12px}
.inbox-empty b{display:block;font-size:16px;color:var(--fg);margin-bottom:6px}
.work.noboard .panel{flex:1;width:auto;max-width:560px}
.zone{display:flex;flex-direction:column;gap:8px;min-height:8px}
.inbox-zone{padding:8px 0;min-height:60px}

/* Board */
.boards{flex:1;min-width:0;display:flex;gap:8px}
.board.active-pane{box-shadow:0 0 0 2px var(--accent)}
.board{flex:1;min-width:0;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;position:relative;background-size:cover}
.board-head{display:flex;align-items:center;gap:6px;padding:10px 12px 10px 16px;background:rgba(0,0,0,.24);backdrop-filter:blur(4px);color:#fff;flex-wrap:wrap}
.board-title{font-size:18px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff}
.board-title:hover{background:rgba(255,255,255,.2)}
.board-title-input{font-size:18px;font-weight:700;padding:2px 8px;border-radius:4px;border:0;width:min(320px,60vw)}
.bh-btn{height:32px;min-width:32px;padding:0 8px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;color:#fff}
.bh-btn:hover{background:rgba(255,255,255,.2)}
.bh-btn.on{background:rgba(255,255,255,.85);color:#172b4d}
.bh-btn .starred{color:#f5cd47;fill:#f5cd47}
.bh-spacer{flex:1}
.hide-multi{display:none}
.autosave-note{font-size:12px;color:var(--muted);align-self:center}
.boards .board .board-head{flex-wrap:nowrap}
.board-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lists{flex:1;display:flex;align-items:flex-start;gap:12px;padding:12px;overflow-x:auto;overflow-y:hidden;min-height:0}
.list{width:272px;flex:none;background:var(--lbg,var(--list-bg));border-radius:12px;display:flex;flex-direction:column;max-height:100%;box-shadow:0 1px 1px rgba(9,30,66,.25)}
.list-head{display:flex;align-items:center;gap:2px;padding:8px 6px 4px 12px;cursor:grab;user-select:none;-webkit-user-select:none}
.list-title{flex:1;font-weight:600;padding:4px 4px;border-radius:4px;overflow-wrap:anywhere;min-width:0}
.list-title-input{flex:1;font-weight:600;padding:3px 6px;border:2px solid var(--accent);border-radius:4px;background:var(--input-bg);min-width:0}
.count{font-size:13px;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.list .icon-btn{width:30px;height:30px}
.cards{flex:1;overflow-y:auto;padding:4px 8px 2px;min-height:6px;display:flex;flex-direction:column;gap:8px}
.list-foot{padding:4px 8px 8px}
.add-card-btn{width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--muted);font-weight:500;text-align:left}
.add-card-btn:hover{background:var(--hover);color:var(--fg)}
.composer textarea{width:100%;border:0;border-radius:8px;padding:8px 12px;background:var(--card-bg);box-shadow:var(--card-shadow);resize:none;min-height:56px}
.composer-row{display:flex;align-items:center;gap:4px;margin-top:8px}
.list.collapsed{width:44px;cursor:pointer;padding:10px 0;align-items:center;gap:10px}
.list.collapsed .vtitle{writing-mode:vertical-rl;font-weight:600;white-space:nowrap}
.add-list{width:272px;flex:none;border-radius:12px;background:rgba(255,255,255,.24);color:#fff}
.add-list:hover{background:rgba(255,255,255,.32)}
.add-list>button{width:100%;display:flex;align-items:center;gap:8px;padding:12px;font-weight:600;color:#fff}
.add-list form{background:var(--list-bg);border-radius:12px;padding:8px;color:var(--fg)}
.add-list input{width:100%;padding:6px 10px;border:2px solid var(--accent);border-radius:4px;background:var(--input-bg)}

/* Cards */
.card{position:relative;background:var(--card-bg);border-radius:8px;box-shadow:var(--card-shadow);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;flex:none}
.card:hover{box-shadow:0 0 0 2px var(--accent)}
.card-body{padding:8px 12px 6px}
.cover{height:32px}
.lbls{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lbl{height:8px;min-width:40px;border-radius:4px}
.lbl.wide{height:auto;min-width:48px;padding:0 8px;font-size:12px;font-weight:500;line-height:20px;color:var(--lb-fg)}
.card-title{display:flex;align-items:flex-start;gap:0;overflow-wrap:anywhere}
.tick{padding:0;width:0;overflow:hidden;flex:none;margin-top:2px;transition:width .15s,margin .15s;color:var(--muted);border-radius:50%}
.card:hover .tick,.card.done .tick,.tick:focus-visible{width:16px;margin-right:6px}
.card.done .tick{color:var(--ok)}
.card-title-text{min-width:0}
.badges{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;color:var(--muted);font-size:12px}
.badges:empty{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:3px;padding:1px 4px 1px 2px}
.badge.ok{background:var(--ok);color:#fff}
.badge.soon{background:var(--warn-bg);color:var(--warn-fg)}
.badge.late{background:#c9372c;color:#fff}
.badges .avatar{margin-left:auto}
.card-tools{position:absolute;right:4px;top:4px;display:none;gap:2px}
.card:hover .card-tools,.card:focus-within .card-tools{display:flex}
.edit-btn{width:28px;height:28px;border-radius:50%;background:var(--card-bg);display:grid;place-items:center;color:var(--muted)}
.qs-row{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:4px}
.qs-row:hover{background:var(--hover)}
.qs-row input{width:16px;height:16px;margin-top:2px;flex:none}
.qs-row span{flex:1;min-width:0;overflow-wrap:anywhere}
.qs-row.done span{text-decoration:line-through;color:var(--muted)}
.qs-row .icon-btn{width:22px;height:22px;visibility:hidden}
.qs-row:hover .icon-btn{visibility:visible}
.edit-btn:hover{background:var(--field-bg)}
.meta-line{font-size:11px;color:var(--muted);margin-top:2px}

/* Drag & drop */
.drag-src{display:none!important}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:.95;box-shadow:var(--shadow-lg)!important}
.ph-card{border-radius:8px;background:var(--hover-strong);flex:none}
.ph-list{width:272px;flex:none;border-radius:12px;background:rgba(0,0,0,.2);align-self:stretch;max-height:100%}
body.dragging,body.dragging *{cursor:grabbing!important}

/* Planner */
.planner-nav{display:flex;align-items:center;gap:4px;padding:0 8px 8px 16px;font-size:13px;color:var(--muted)}
.planner-nav .grow{flex:1;font-weight:600;color:var(--fg)}
.day{background:var(--card-bg);border-radius:10px;padding:8px;margin-bottom:8px;box-shadow:0 0 0 1px var(--border)}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.day-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 2px 6px}
.day.today .day-head{color:var(--accent)}
.day .zone{min-height:24px}
.day .card{box-shadow:0 0 0 1px var(--border)}
.day-add{color:var(--muted);width:24px;height:24px;display:grid;place-items:center;border-radius:4px}
.day-add:hover{background:var(--hover)}
.day-input{width:100%;margin-top:6px;padding:6px 8px;border:2px solid var(--accent);border-radius:6px;background:var(--input-bg)}

/* Dock */
.dock{flex:none;display:flex;justify-content:center;padding:4px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.dock-inner{display:flex;gap:2px;padding:4px;background:var(--top-bg);border-radius:10px;box-shadow:var(--shadow-lg);max-width:100%;overflow-x:auto}
.dock button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-weight:500;position:relative;white-space:nowrap;color:var(--fg)}
.dock button:hover{background:var(--hover)}
.dock button.on{background:var(--accent-soft);color:var(--accent)}
.dock button.on::after{content:"";position:absolute;left:50%;bottom:0;width:16px;height:2px;margin-left:-8px;background:var(--accent);border-radius:2px}
.dock .sep{width:1px;background:var(--border);margin:4px 4px}

/* Popovers */
.pop{position:fixed;z-index:500;width:304px;max-width:calc(100vw - 16px);max-height:calc(100% - 16px);overflow-y:auto;background:var(--pop-bg);border-radius:8px;box-shadow:var(--shadow-lg);padding:4px 12px 12px;color:var(--fg)}
.pop-head{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;text-align:center;font-weight:600;color:var(--muted);padding:4px 0}
.pop-head span{grid-column:2}
.pop-head .icon-btn{grid-column:3}
.pop h4{font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.menu-item{display:flex;width:100%;align-items:center;gap:8px;padding:6px 12px;margin:0 -12px;width:calc(100% + 24px);text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-sep{height:1px;background:var(--border);margin:8px 0}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.swatch{height:32px;border-radius:4px;position:relative}
.swatch.sel{box-shadow:0 0 0 2px var(--pop-bg),0 0 0 4px var(--accent)}
.bg-swatch{height:40px}
.field{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--input-bg)}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.lbl-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lbl-row input[type=checkbox]{width:16px;height:16px}
.lbl-row .chip{flex:1;height:32px;border-radius:4px;padding:0 10px;display:flex;align-items:center;font-weight:500;color:var(--lb-fg);text-align:left}
.lbl-row .chip:hover{filter:brightness(.95)}
.check-row{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
.board-pick{display:flex;align-items:center;gap:10px;padding:6px 12px;margin:0 -12px;width:calc(100% + 24px);text-align:left}
.board-pick:hover{background:var(--hover)}
.board-pick .thumb{width:40px;height:28px;border-radius:4px;flex:none}
.board-pick.cur{font-weight:700}
.board-pick .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Modal */
.modal-back{position:fixed;inset:0;z-index:300;background:rgba(9,30,66,.55);overflow-y:auto;padding:48px 16px}
.modal{position:relative;max-width:768px;margin:0 auto;background:var(--modal-bg);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden}
.m-cover{height:96px}
.m-close{position:absolute;right:8px;top:8px;background:var(--modal-bg)}
.m-head{display:flex;gap:10px;padding:20px 56px 4px 20px}
.m-head .tick-lg{padding:0;margin-top:6px;color:var(--muted);flex:none;border-radius:50%}
.m-head .tick-lg.on{color:var(--ok)}
.m-title{flex:1;font-size:20px;font-weight:600;border:0;background:transparent;resize:none;padding:2px 6px;border-radius:4px;overflow:hidden;min-width:0}
.m-title:focus{background:var(--input-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.m-sub{padding:0 20px 0 52px;color:var(--muted);font-size:13px}
.m-sub button{text-decoration:underline;color:var(--muted)}
.m-grid{display:grid;grid-template-columns:minmax(0,1fr) 184px;gap:24px;padding:16px 20px 24px}
.m-meta{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.m-meta h4,.m-sec h4,.m-side h4{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.m-meta .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.m-meta .lbl.wide{height:32px;line-height:32px;border-radius:4px;padding:0 12px;font-size:14px}
.chipbtn{height:32px;padding:0 10px;border-radius:4px;background:var(--hover);display:inline-flex;align-items:center;gap:6px}
.chipbtn:hover{background:var(--hover-strong)}
.duepill{font-size:12px;padding:1px 6px;border-radius:3px;font-weight:600}
.duepill.ok{background:var(--ok);color:#fff}.duepill.late{background:#c9372c;color:#fff}.duepill.soon{background:var(--warn-bg);color:var(--warn-fg)}
.m-sec{margin-bottom:24px}
.m-sec-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.m-sec-head h3{font-size:16px;margin:0;flex:1}
.desc-view{padding:8px 12px;border-radius:4px;background:var(--hover);min-height:56px;white-space:pre-wrap;cursor:pointer;overflow-wrap:anywhere}
.desc-view.filled{background:transparent;padding:0;min-height:0}
.desc-edit{width:100%;min-height:120px;padding:8px 12px;border:2px solid var(--accent);border-radius:4px;background:var(--input-bg);resize:vertical}
.btn-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.progress{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:6px}
.progress .bar{flex:1;height:8px;border-radius:4px;background:var(--hover-strong);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.progress.full .bar i{background:var(--ok)}
.ci{display:flex;align-items:flex-start;gap:8px;padding:4px 6px;border-radius:4px}
.ci:hover{background:var(--hover)}
.ci input[type=checkbox]{width:16px;height:16px;margin-top:3px;flex:none}
.ci .txt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:text}
.ci.done .txt{text-decoration:line-through;color:var(--muted)}
.ci .icon-btn{width:24px;height:24px;visibility:hidden}
.ci:hover .icon-btn{visibility:visible}
.ci-edit{flex:1;padding:4px 8px;border:2px solid var(--accent);border-radius:4px;background:var(--input-bg)}
.comment-box{display:flex;gap:8px;margin-bottom:12px}
.comment-box textarea{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);resize:vertical;min-height:40px}
.act{display:flex;gap:8px;margin-bottom:12px;font-size:13px}
.act .who{font-weight:600}
.act .when{color:var(--muted);font-size:12px}
.act .bubble{background:var(--input-bg);border-radius:8px;padding:8px 12px;box-shadow:var(--card-shadow);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.act .lnk{font-size:12px;color:var(--muted);text-decoration:underline;margin-top:2px}
.m-side{display:flex;flex-direction:column;gap:6px}
.side-btn{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:4px;background:var(--hover);font-weight:500;text-align:left;width:100%}
.side-btn:hover{background:var(--hover-strong)}
.side-btn.danger{background:#c9372c;color:#fff}
.m-side h4{margin-top:10px}
.tpl-note{background:var(--accent-soft)!important;color:var(--accent)!important}
.tpl-row{display:flex;align-items:center;gap:4px}
.tpl-row .board-pick{flex:1;min-width:0}
.tpl-meta{font-size:11px;color:var(--muted);flex:none}
.archived-note{background:var(--warn-bg);color:var(--warn-fg);padding:10px 20px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Drawer */
.drawer{position:absolute;top:0;right:0;bottom:0;width:340px;max-width:100%;background:var(--pop-bg);z-index:200;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-radius:12px 0 0 12px}
.drawer-body{flex:1;overflow-y:auto;padding:0 16px 16px}
.drawer h4{font-size:12px;color:var(--muted);margin:16px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.arch-item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border)}
.arch-item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.lbl-edit{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lbl-edit i{width:40px;height:28px;border-radius:4px;flex:none}

/* Attachments */
.att{display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px}
.att:hover{background:var(--hover)}
.att-ic{width:56px;height:40px;border-radius:4px;background:var(--hover-strong);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none;text-transform:uppercase}
.att-ic.mail{background:var(--accent-soft);color:var(--accent)}
.att-main{flex:1;min-width:0}
.att-main b{display:block;font-weight:600;overflow-wrap:anywhere}
.att-main span{font-size:12px;color:var(--muted)}
.att-hint{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop-hl{box-shadow:0 0 0 3px var(--accent)!important}
.list.drop-hl,.panel.drop-hl{outline:3px solid var(--accent);outline-offset:-3px}

/* Toast */
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#172b4d;color:#fff;padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;z-index:900;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.toast button{color:#85b8ff;font-weight:600;text-decoration:underline}

.only-narrow{display:none}
@media (max-width:760px){
  .hide-narrow{display:none!important}
  .boards .board:not(.cur-pane){display:none}.only-narrow{display:inline}
  .work{padding:8px 6px}
  .panel{flex:1;width:auto}
  .logo span,.btn .lbl-txt{display:none}
  .m-grid{grid-template-columns:1fr}
  .m-side{display:grid;grid-template-columns:1fr 1fr}
  .m-side h4{grid-column:1/-1}
  .modal-back{padding:16px 8px}
  .dock button{padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MAAND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DAG=['zo','ma','di','wo','do','vr','za'];
const fmtDue=s=>{const d=parseISO(s);return `${d.getDate()} ${MAAND[d.getMonth()]}`};
const fmtTime=t=>{const d=new Date(t);return `${d.getDate()} ${MAAND[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const ICONS={
 download:'<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/>', upload:'<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',

 collapse:'<path d="M2 12h7M6 8.5L9.5 12 6 15.5M22 12h-7M18 8.5L14.5 12l3.5 3.5"/>',

 filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',

 calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',

 circle:'<circle cx="12" cy="12" r="8.5"/>',

 cover:'<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 10h17"/>',

 back:'<path d="M15 6l-6 6 6 6"/>', fwd:'<path d="M9 6l6 6-6 6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
 restore:'<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/>',

 clip:'<path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/>',
 layout:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
 rows:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 cols:'<path d="M6 4v16M12 4v16M18 4v16"/>',
 split:'<rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M12 4.5v15"/>',
 sort:'<path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/>'
};
const ic=(n,s=16,cls='')=>`<svg class="ic ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

const BGS={
 paars:'linear-gradient(175deg,#5b4cbe 0%,#9a5cc9 48%,#e27cbc 100%)',
 oceaan:'linear-gradient(160deg,#0c66e4 0%,#09326c 100%)',
 zonsondergang:'linear-gradient(160deg,#f99cdb 0%,#fea362 55%,#f5cd47 100%)',
 aurora:'linear-gradient(160deg,#00a3bf 0%,#6e5dc6 100%)',
 bos:'linear-gradient(160deg,#22a06b 0%,#164b35 100%)',
 nacht:'linear-gradient(160deg,#44546f 0%,#1d2125 100%)',
 blauw:'#0079bf', oranje:'#d29034', groen:'#519839', rood:'#b04632', violet:'#89609e', roze:'#cd5a91', lime:'#4bbf6b', grijs:'#838c91'
};
const LIST_COLORS=['none','yellow','green','blue','purple','red','orange','teal','pink'];
const LABEL_COLORS=['green','yellow','orange','red','purple','blue','sky','pink'];
// Extra ready-made colours next to the theme ones; any '#rrggbb' from the colour picker works too.
const EXTRA_COLORS=['#94c748','#1f845a','#0c66e4','#09326c','#6e5dc6','#ae4787','#c9372c','#e56910','#a54800','#7f5f01','#626f86','#172b4d'];
const isHex=c=>typeof c==='string'&&c[0]==='#';
const lb=c=>isHex(c)?c:`var(--lb-${c})`;
const lc=c=>isHex(c)?c:c==='none'?'var(--list-bg)':`var(--lc-${c})`;
function darkHex(c){const n=parseInt(c.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)<150}
const ink=c=>isHex(c)?`color:${darkHex(c)?'#fff':'#172b4d'};`:'';
const cname=c=>isHex(c)?'Eigen kleur':(COLOR_NL[c]||c);
function colorPicker(kind,id,cur,named){
  return `<div class="swatches">${named.map(c=>`<button class="swatch ${cur===c?'sel':''}" style="background:${kind==='list'?lc(c):lb(c)};${c==='none'?'box-shadow:inset 0 0 0 1px var(--border)':''}" data-act="pickColor" data-id="${kind}|${id}|${c}" aria-label="${cname(c)}" title="${cname(c)}"></button>`).join('')}
    ${EXTRA_COLORS.map(c=>`<button class="swatch ${cur===c?'sel':''}" style="background:${c}" data-act="pickColor" data-id="${kind}|${id}|${c}" aria-label="${c}" title="${c}"></button>`).join('')}</div>
    <label class="own-color"><input type="color" data-color-pick="${kind}|${id}" value="${isHex(cur)?cur:'#6e5dc6'}"><span>Eigen kleur kiezen</span>${isHex(cur)&&!EXTRA_COLORS.includes(cur)?`<i style="background:${cur}"></i>`:''}</label>`;
}
const COLOR_NL={none:'Geen',yellow:'Geel',green:'Groen',blue:'Blauw',purple:'Paars',red:'Rood',orange:'Oranje',teal:'Turquoise',pink:'Roze',sky:'Lichtblauw'};

/* ---------- state ---------- */
const LS_KEY='planbord.v1';
function mkCard(title,extra){return Object.assign({id:uid(),title,desc:'',labels:[],due:null,done:false,watch:false,members:[],cover:null,checklists:[],comments:[],activity:[{text:'heeft deze kaart toegevoegd',at:Date.now()}],created:Date.now()},extra||{})}
function defaultLabels(){return LABEL_COLORS.slice(0,6).map(c=>({id:uid(),color:c,name:''}))}
function mkBoard(title,bg,lists){return {id:uid(),title,bg,starred:false,labels:defaultLabels(),lists:(lists||[]).map(l=>({id:uid(),title:l,color:'none',collapsed:false,cards:[]})),archive:{cards:[],lists:[]}}}
function seed(){
  const b=mkBoard('Mijn Trello-bord','paars',['Vandaag','Deze week','Later','Aanvraag staat uit','nakijken']);
  b.starred=true;
  b.lists[0].color='yellow'; b.lists[1].color='green';
  b.lists[0].cards.push(mkCard('Aan de slag met Trello',{done:true,watch:true,members:['LE']}));

    .forEach(t=>b.lists[2].cards.push(mkCard(t)));

  S.open=(S.open||[]).filter((id,i,a)=>a.indexOf(id)===i&&S.boards.some(b=>b.id===id));

  if(!S.open.includes(id)){const i=S.open.indexOf(S.current);S.open[i<0?0:i]=id}

}
function findList(id){for(const b of S.boards){const l=b.lists.find(l=>l.id===id);if(l)return {list:l,board:b}}return null}
function locate(id){
  let i=S.inbox.findIndex(c=>c.id===id); if(i>=0) return {card:S.inbox[i],arr:S.inbox,i,list:null,board:null};
  i=(S.templates||[]).findIndex(c=>c.id===id); if(i>=0) return {card:S.templates[i],arr:S.templates,i,list:null,board:null,template:true};
  for(const b of S.boards){for(const l of b.lists){i=l.cards.findIndex(c=>c.id===id);if(i>=0)return {card:l.cards[i],arr:l.cards,i,list:l,board:b}}
    i=b.archive.cards.findIndex(a=>a.card.id===id); if(i>=0) return {card:b.archive.cards[i].card,arr:null,i,list:null,board:b,archived:true};}
  return null;
}

let q='';
let weekStart=(()=>{const d=new Date();d.setHours(0,0,0,0);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return d})();

const narrow=()=>window.matchMedia('(max-width:760px)').matches;

function dueState(c){
  if(!c.due) return '';
  if(c.done) return 'ok';
  const today=iso(new Date()); if(c.due<today) return 'late';
  const t=new Date();t.setDate(t.getDate()+1); if(c.due<=iso(t)) return 'soon';
  return '';
}
function filterActive(){return filter.labels.size+filter.due.size+filter.status.size>0||q.trim()!==''}
function matches(c){
  const qq=q.trim().toLowerCase();
  if(qq&&!(c.title.toLowerCase().includes(qq)||(c.desc||'').toLowerCase().includes(qq))) return false;
  if(filter.labels.size&&!c.labels.some(l=>filter.labels.has(l))) return false;
  if(filter.due.size){const st=dueState(c);let ok=false;
    if(filter.due.has('none')&&!c.due) ok=true;
    if(filter.due.has('late')&&st==='late') ok=true;
    if(filter.due.has('soon')&&st==='soon') ok=true;
    if(filter.due.has('week')&&c.due&&!c.done){const t=new Date();t.setDate(t.getDate()+7);if(c.due<=iso(t)&&c.due>=iso(new Date()))ok=true}
    if(!ok) return false;}
  if(filter.status.size){if(c.done&&!filter.status.has('done'))return false;if(!c.done&&!filter.status.has('open'))return false}
  return true;
}
function labelOf(b,id){for(const bb of [b,...S.boards]){const l=bb&&bb.labels.find(x=>x.id===id);if(l)return l}return null}

/* ---------- render: cards ---------- */
function cardHtml(c,b,opts={}){
  const lbls=c.labels.map(id=>labelOf(b,id)).filter(Boolean);
  const checks=c.checklists.reduce((a,cl)=>[a[0]+cl.items.filter(i=>i.done).length,a[1]+cl.items.length],[0,0]);
  const st=dueState(c);
  let badges='';
  if(c.watch) badges+=`<span class="badge" title="Je volgt deze kaart">${ic('eye',14)}</span>`;
  if(c.due) badges+=`<span class="badge ${st}" title="Vervaldatum">${ic('clock',14)}${fmtDue(c.due)}</span>`;
  if(c.desc) badges+=`<span class="badge" title="Deze kaart heeft een beschrijving">${ic('desc',14)}</span>`;
  if(c.attachments&&c.attachments.length) badges+=`<span class="badge" title="Bijlagen">${ic('clip',14)}${c.attachments.length}</span>`;
  if(c.comments.length) badges+=`<span class="badge" title="Opmerkingen">${ic('chat',14)}${c.comments.length}</span>`;
  if(checks[1]) badges+=`<span class="badge ${checks[0]===checks[1]?'ok':''}" title="Checklist-items">${ic('checklist',14)}${checks[0]}/${checks[1]}</span>`;
  if(c.members.length) badges+=c.members.map(m=>`<span class="avatar sm" title="Leon Janssen">${esc(m)}</span>`).join('');
  const finished=c.done||(checks[1]>0&&checks[0]===checks[1]);
  return `<div class="card ${c.done?'done':''} ${finished?'finished':''}" data-card="${c.id}" tabindex="0" aria-label="${esc(c.title)}">
    ${c.cover?`<div class="cover" style="background:${lb(c.cover)}"></div>`:''}
    <div class="card-body">
      ${lbls.length?`<div class="lbls">${lbls.map(l=>`<span class="lbl ${l.name?'wide':''}" style="background:${lb(l.color)};${ink(l.color)}" title="${esc(l.name||cname(l.color))}">${esc(l.name)}</span>`).join('')}</div>`:''}
      <div class="card-title"><button class="tick" data-act="toggleDone" data-id="${c.id}" aria-label="${c.done?'Markeren als niet voltooid':'Markeren als voltooid'}">${ic(c.done?'circleCheck':'circle',16)}</button><span class="card-title-text">${esc(c.title)}</span></div>
      ${opts.meta?`<div class="meta-line">${esc(opts.meta)}</div>`:''}
      <div class="badges">${badges}</div>
    </div>
    <div class="card-tools"><button class="edit-btn" data-act="quickSteps" data-id="${c.id}" aria-label="Actiestappen" title="Actiestappen">${ic('checklist',14)}</button><button class="edit-btn" data-act="openCard" data-id="${c.id}" aria-label="Kaart openen" title="Kaart openen">${ic('pencil',14)}</button></div>
  </div>`;
}

/* ---------- render: board ---------- */
function renderBoard(skipDrawer){
  fixOpen();
  const host=$('#boards'); host.hidden=!S.ui.board;
  const multi=S.open.length>1;
  const keep=new Set(S.open);
  host.querySelectorAll(':scope > [data-pane]').forEach(el=>{if(!keep.has(el.dataset.pane))el.remove()});
  S.open.forEach((bid,idx)=>{
    const b=S.boards.find(x=>x.id===bid);
    let pane=host.querySelector(`:scope > [data-pane="${bid}"]`);
    if(!pane){pane=document.createElement('section');pane.className='board';pane.dataset.pane=bid;pane.innerHTML=`<div class="board-head"></div><div class="lists" data-lists="${bid}"></div>`}
    if(host.children[idx]!==pane) host.insertBefore(pane,host.children[idx]||null);
    renderPane(pane,b,multi);
  });
  if(editingBoardTitle){const i=document.querySelector('[data-board-title-input]');i&&(i.focus(),i.select())}
  if(addingList){const i=document.querySelector(`[data-add-list-form="${addingList}"] input`);i&&i.focus()}
  if(composer&&composer!=='inbox'){const t=document.querySelector(`[data-composer="${composer}"]`);t&&t.focus()}
  if(editingListTitle){const i=document.querySelector(`[data-list-title-input]`);if(i){i.focus();i.select()}}
  if(!skipDrawer) renderDrawer();
}
function markActivePane(){
  document.querySelectorAll('#boards > [data-pane]').forEach(el=>{const on=el.dataset.pane===S.current;el.classList.toggle('cur-pane',on);el.classList.toggle('active-pane',on&&S.open.length>1)});
}

  lists.querySelectorAll('.list[data-list]').forEach(el=>{const z=el.querySelector('.cards');if(z&&scrolls[el.dataset.list])z.scrollTop=scrolls[el.dataset.list]});

      ${editingListTitle===l.id?`<input class="list-title-input" data-list-title-input="${l.id}" value="${esc(l.title)}" aria-label="Lijstnaam">`:`<h2 class="list-title" style="font-size:14px;margin:0" data-title-of="${l.id}">${esc(l.title)}</h2>`}

function allDated(){
  const out=[];
  S.inbox.forEach(c=>c.due&&out.push({c,meta:'Inbox',b:board()}));
  S.boards.forEach(b=>b.lists.forEach(l=>l.cards.forEach(c=>c.due&&out.push({c,meta:`${b.title} · ${l.title}`,b}))));
  return out;
}
function renderPlanner(){
  const p=$('#plannerPanel'); p.hidden=!S.ui.planner; if(!S.ui.planner) return;
  const dated=allDated().filter(x=>matches(x.c)); const today=iso(new Date());
  const end=new Date(weekStart);end.setDate(end.getDate()+6);
  let days='';
  for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(d.getDate()+i);const k=iso(d);
    const items=dated.filter(x=>x.c.due===k);
    days+=`<div class="day ${k===today?'today':''}"><div class="day-head"><span>${DAG[d.getDay()]} ${d.getDate()} ${MAAND[d.getMonth()]}${k===today?' · vandaag':''}</span><button class="day-add" data-act="dayAdd" data-id="${k}" aria-label="Kaart toevoegen op ${d.getDate()} ${MAAND[d.getMonth()]}">${ic('plus',14)}</button></div>
      <div class="zone" data-drop="day:${k}">${items.map(x=>cardHtml(x.c,x.b,{meta:x.meta})).join('')}</div>
      ${dayAdding===k?`<form data-day-form="${k}"><input class="day-input" data-day-input="${k}" placeholder="Titel, Enter om op te slaan" aria-label="Kaarttitel"></form>`:''}
    </div>`;}
  p.innerHTML=`<div class="panel-head">${ic('calendar',18)}<span class="grow">Planner</span><button class="icon-btn" data-act="togglePanel" data-id="planner" aria-label="Planner sluiten">${ic('x')}</button></div>
  <div class="planner-nav"><span class="grow">${weekStart.getDate()} ${MAAND[weekStart.getMonth()]} – ${end.getDate()} ${MAAND[end.getMonth()]} ${end.getFullYear()}</span>
    <button class="btn sm" data-act="weekToday">Vandaag</button>
    <button class="icon-btn" data-act="weekPrev" aria-label="Vorige week">${ic('back')}</button>
    <button class="icon-btn" data-act="weekNext" aria-label="Volgende week">${ic('fwd')}</button></div>
  <div class="panel-body">${days}<p style="font-size:12px;color:var(--muted);padding:0 4px">Sleep een kaart naar een dag om de vervaldatum te zetten.</p></div>`;
  if(dayAdding){const i=document.querySelector(`[data-day-input="${dayAdding}"]`);i&&i.focus()}
}

function allArchived(){return S.boards.flatMap(b=>b.archive.cards.map(a=>({...a,board:b})))}
function renderArchiveCount(){const n=allArchived().length;$('#archCount').textContent=n?String(n):'';renderArchPage()}
let archQ='',archConfirm=null;
let archPage=false,archBoard='';
const DAGVOL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAANDVOL=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
function archAt(a){if(a.at)return a.at;const l=(a.card.activity||[]).filter(x=>/gearchiveerd/.test(x.text)).sort((x,y)=>y.at-x.at)[0];return l?l.at:0}
function dayKey(t){if(!t)return 'onbekend';const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dayTitle(k){if(k==='onbekend')return ['Eerder gearchiveerd','datum onbekend'];
  const [y,m,dd]=k.split('-').map(Number);const d=new Date(y,m-1,dd);const t=new Date();t.setHours(0,0,0,0);const diff=Math.round((t-d)/864e5);
  const full=`${DAGVOL[d.getDay()]} ${dd} ${MAANDVOL[m-1]}${y!==t.getFullYear()?' '+y:''}`;
  return diff===0?['Vandaag',full]:diff===1?['Gisteren',full]:[full.charAt(0).toUpperCase()+full.slice(1),'']}
function fillArchive(){
  const page=$('#archPage');if(!page)return;
  const body=page.querySelector('.ap-body');const qq=archQ.toLowerCase();
  const listName=a=>a.listId==='inbox'?'Inbox':(a.board.lists.find(l=>l.id===a.listId)||a.board.archive.lists.find(l=>l.id===a.listId)||{}).title||'verwijderde lijst';
  const entries=[...allArchived().filter(a=>(!archBoard||a.board.id===archBoard)&&(!qq||a.card.title.toLowerCase().includes(qq))).map(a=>({kind:'card',a,at:archAt(a)})),
    ...S.boards.filter(b=>!archBoard||b.id===archBoard).flatMap(b=>b.archive.lists.filter(l=>!qq||l.title.toLowerCase().includes(qq)).map(l=>({kind:'list',l,b,at:l.archivedAt||0})))]
    .sort((x,y)=>y.at-x.at);
  const total=allArchived().length+S.boards.reduce((n,b)=>n+b.archive.lists.length,0);
  page.querySelector('#apCount').textContent=total?`${total} ${total===1?'item':'items'}`:'';
  if(!entries.length){body.innerHTML=`<p class="ap-empty">${qq||archBoard?'Niets gevonden.':'Het archief is leeg.<br>Sleep een kaart naar de archiefdoos bovenin om hem te archiveren.'}</p>`;return}
  const groups=new Map();entries.forEach(e=>{const k=dayKey(e.at);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});
  const time=t=>t?`${pad(new Date(t).getHours())}:${pad(new Date(t).getMinutes())}`:'';
  const tile=e=>{
    if(e.kind==='list')return `<div class="ap-tile"><span class="ap-kind">Lijst</span><b style="cursor:default;text-decoration:none">${esc(e.l.title)}</b>
      <div class="ap-meta"><span>${esc(e.b.title)}</span><span>${e.l.cards.length} ${e.l.cards.length===1?'kaart':'kaarten'}</span>${e.at?`<span>om ${time(e.at)}</span>`:''}</div>
      <div class="ap-acts"><button class="btn sm" data-act="archRestoreList" data-id="${e.b.id}:${e.l.id}">Herstellen</button></div></div>`;
    const a=e.a,c=a.card,lbls=c.labels.map(id=>labelOf(a.board,id)).filter(Boolean);
    const items=(c.checklists||[]).flatMap(x=>x.items),done=items.filter(i=>i.done).length;

let pendingFocus=null;
function autosize(t){if(!t)return;t.style.height='auto';t.style.height=t.scrollHeight+'px'}

/* ---------- attachments (files kept in IndexedDB, details on the card) ---------- */
const FILES=(()=>{let dbp;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('planbord-bestanden',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('files',mode);const r=fn(t.objectStore('files'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
  return {put:(k,v)=>run('readwrite',s=>s.put(v,k)),get:k=>run('readonly',s=>s.get(k)),del:k=>run('readwrite',s=>s.delete(k))};
})();
const fmtSize=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' kB':(n/1048576).toFixed(1)+' MB';
const extOf=n=>(n.match(/\.([a-z0-9]{1,5})$/i)||[,''])[1].toLowerCase();
const isMail=n=>['msg','eml'].includes(extOf(n));
function decodeWords(v){
  return v.replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g,(m,cs,enc,txt)=>{try{
    let bytes;
    if(enc.toUpperCase()==='B'){const b=atob(txt);bytes=Uint8Array.from(b,ch=>ch.charCodeAt(0))}
    else{const t=txt.replace(/_/g,' ');const out=[];for(let i=0;i<t.length;i++){if(t[i]==='='&&/^[0-9a-f]{2}$/i.test(t.substr(i+1,2))){out.push(parseInt(t.substr(i+1,2),16));i+=2}else out.push(t.charCodeAt(i))}bytes=new Uint8Array(out)}
    return new TextDecoder(cs.toLowerCase()).decode(bytes)}catch(e){return m}}).replace(/\?=\s+=\?/g,'?==?');
}
async function mailInfo(file){
  if(extOf(file.name)!=='eml') return isMail(file.name)?{subject:file.name.replace(/\.msg$/i,''),from:'',date:''}:null;
  try{
    const txt=await file.slice(0,65536).text();
    const head=txt.split(/\r?\n\r?\n/)[0].replace(/\r?\n[ \t]+/g,' ');
    const get=h=>{const m=head.match(new RegExp('^'+h+':\\s*(.*)$','im'));return m?decodeWords(m[1].trim()):''};
    const from=get('From').replace(/\s*<[^>]+>/,'').replace(/^"|"$/g,'')||get('From');
    const d=new Date(get('Date'));
    return {subject:get('Subject')||file.name.replace(/\.eml$/i,''),from,date:isNaN(d)?'':d.getTime()};
  }catch(e){return {subject:file.name,from:'',date:''}}
}
function attHtml(a){
  const ext=extOf(a.name)||'bestand';
  const m=a.mail;
  const title=m?m.subject:a.name;
  const sub=[m&&m.from?'Van '+m.from:'',m&&m.date?fmtTime(m.date):'',fmtSize(a.size),m?a.name:''].filter(Boolean).join(' · ');
  return `<div class="att"><div class="att-ic ${m?'mail':''}">${m?'Mail':esc(ext)}</div><div class="att-main"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
    <button class="btn sm" data-act="openAtt" data-id="${a.id}">Openen</button><button class="icon-btn" data-act="delAtt" data-id="${a.id}" aria-label="Bijlage verwijderen">${ic('trash',14)}</button></div>`;
}
async function addFiles(cardId,files){
  const loc=locate(cardId);if(!loc)return;const c=loc.card;c.attachments=c.attachments||[];
  let n=0;
  for(const f of files){
    const id=uid();
    try{await FILES.put(id,f)}catch(e){toast(`"${f.name}" kon niet worden opgeslagen. Mogelijk is de opslag van je browser vol.`);continue}
    const mail=await mailInfo(f);
    c.attachments.push({id,name:f.name,size:f.size,type:f.type||'',added:Date.now(),mail});
    log(c,`heeft ${mail?'de mail':'de bijlage'} ${mail?mail.subject:f.name} toegevoegd`);n++;
  }
  if(n){commit();toast(n===1?'Bijlage toegevoegd':`${n} bijlagen toegevoegd`)}
}
async function titleFromFiles(files){const f=files[0];const m=await mailInfo(f);return m?m.subject:f.name.replace(/\.[^.]+$/,'')}
function attRefs(id){let n=0;const scan=c=>(c.attachments||[]).forEach(a=>a.id===id&&n++);S.inbox.forEach(scan);(S.templates||[]).forEach(scan);S.boards.forEach(b=>{b.lists.forEach(l=>l.cards.forEach(scan));b.archive.lists.forEach(l=>l.cards.forEach(scan));b.archive.cards.forEach(a=>scan(a.card))});return n}
function dropBlobs(card){(card.attachments||[]).forEach(a=>{if(!attRefs(a.id))FILES.del(a.id).catch(()=>{})})}

  const loc=locate(qsCard);if(!loc){closePop();return}
  const draft=body.querySelector('#qsInput')?.value||'';
  const c=loc.card;const items=c.checklists.flatMap(cl=>cl.items.map(it=>({cl,it})));
  const dn=items.filter(x=>x.it.done).length,pc=items.length?Math.round(dn/items.length*100):0;
  body.innerHTML=`<div style="font-weight:600;margin:2px 0 8px;overflow-wrap:anywhere">${esc(c.title)}</div>
    ${items.length?`<div class="progress ${dn===items.length?'full':''}"><span style="width:32px">${pc}%</span><span class="bar"><i style="width:${pc}%"></i></span></div>`:''}
    ${c.checklists.map(cl=>`<div data-sort="${cl.id}">${cl.items.map(it=>`<label class="qs-row ${it.done?'done':''}" data-item="${cl.id}:${it.id}"><span class="grip" data-grip title="Sleep om de volgorde te wijzigen" aria-hidden="true"><svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg></span><input type="checkbox" data-qs-toggle="${cl.id}:${it.id}" ${it.done?'checked':''}><span>${esc(it.text)}</span><button type="button" class="icon-btn" data-act="qsDel" data-id="${cl.id}:${it.id}" aria-label="Stap verwijderen">${ic('x',12)}</button></label>`).join('')}</div>`).join('')}
    <form id="qsForm" style="display:flex;gap:6px;margin-top:8px"><input class="field" id="qsInput" placeholder="Een stap toevoegen" aria-label="Stap toevoegen" autocomplete="off" value="${esc(draft)}"><button class="btn sm" type="submit">Toevoegen</button></form>`;
}
function addQuickStep(text){
  const loc=locate(qsCard);if(!loc)return;const c=loc.card;
  let cl=c.checklists[0];if(!cl){cl={id:uid(),title:'Actiestappen',items:[]};c.checklists.push(cl)}
  cl.items.push({id:uid(),text,done:false});save();renderInbox();renderPlanner();renderBoard(true);
}
function repop(){
  if(!popKey){closePop();return}
  const [act,id]=popKey;closePop();
  const a=[...document.querySelectorAll(`[data-act="${act}"]`)].find(x=>x.dataset.id===id&&x.offsetParent);
  if(a&&ACT[act]) ACT[act](id,a);
}

/* ---------- mutations ---------- */
function addCardTo(target,title,extra){
  const c=mkCard(title,extra);
  if(target==='inbox') S.inbox.push(c); else findList(target).list.cards.push(c);
  return c;
}
function moveCard(id,drop,beforeId){
  if(beforeId===id) return;
  const loc=locate(id); if(!loc||loc.archived) return;
  const from=loc.list?loc.list.title:'Inbox';
  const [c]=loc.arr.splice(loc.i,1);
  let arr,to;
  if(drop==='inbox'){arr=S.inbox;to='Inbox'} else {const f=findList(drop.replace('list:',''));arr=f.list.cards;to=f.list.title}
  const idx=beforeId?arr.findIndex(x=>x.id===beforeId):-1;
  if(idx<0) arr.push(c); else arr.splice(idx,0,c);
  if(from!==to) log(c,`heeft deze kaart verplaatst van ${from} naar ${to}`);
}
function archiveCard(id){
  const loc=locate(id); if(!loc||loc.archived) return;
  loc.arr.splice(loc.i,1);
  const b=loc.board||board();
  b.archive.cards.unshift({card:loc.card,listId:loc.list?loc.list.id:'inbox',at:Date.now()});
  log(loc.card,'heeft deze kaart gearchiveerd');
  toast('Kaart gearchiveerd',()=>{restoreCard(id);commit()});
}
function restoreCard(id){
  for(const b of S.boards){const i=b.archive.cards.findIndex(a=>a.card.id===id);if(i<0)continue;
    const a=b.archive.cards.splice(i,1)[0];
    if(a.listId==='inbox') S.inbox.push(a.card);
    else{const l=b.lists.find(l=>l.id===a.listId)||b.lists[0];if(l) l.cards.push(a.card); else S.inbox.push(a.card)}
    log(a.card,'heeft deze kaart hersteld');return}
}
let toastTimer=null;
function toast(msg,undo){
  let t=$('#toast');t&&t.remove();clearTimeout(toastTimer);
  t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="toastUndo">Ongedaan maken</button>':''}`;
  document.body.appendChild(t);
  if(undo) $('#toastUndo').onclick=()=>{undo();t.remove()};
  toastTimer=setTimeout(()=>t.remove(),5000);
}
function cloneCard(c){const n=JSON.parse(JSON.stringify(c));n.id=uid();n.checklists.forEach(cl=>{cl.id=uid();cl.items.forEach(i=>i.id=uid())});n.comments=[];n.activity=[{text:`heeft deze kaart gekopieerd van ${c.title}`,at:Date.now()}];return n}

  delAtt(id){const c=locate(modalId).card;const a=c.attachments.find(x=>x.id===id);c.attachments=c.attachments.filter(x=>x.id!==id);if(!attRefs(id))FILES.del(id).catch(()=>{});log(c,`heeft de bijlage ${a.mail?a.mail.subject:a.name} verwijderd`);commit()},
  templateMenu(listId,a){

/* ---------- events ---------- */
let justDragged=false;
document.addEventListener('pointerdown',e=>{
  if(popEl&&!popEl.contains(e.target)){const a=e.target.closest('[data-act]');if(a&&a===popAnchor)popSkip=a;closePop()}
},true);
document.addEventListener('click',e=>{
  if(justDragged) return;
  const a=e.target.closest('[data-act]');
  if(a){
    if(a===popSkip){popSkip=null;return}
    const fn=ACT[a.dataset.act]; if(fn){e.preventDefault();fn(a.dataset.id,a,e)} return;
  }
  const title=e.target.closest('[data-title-of]');
  if(title){editingListTitle=title.dataset.titleOf;renderBoard();return}
  const card=e.target.closest('[data-card]');
  if(card&&!e.target.closest('.modal')){ACT.openCard(card.dataset.card)}
});
document.addEventListener('mousedown',e=>{if(e.target.id==='modalBack')ACT.closeModal()});
document.addEventListener('pointerdown',e=>{
  const pane=e.target.closest&&e.target.closest('#boards > [data-pane]');
  if(pane&&pane.dataset.pane!==S.current){S.current=pane.dataset.pane;save();if(drawerOpen){drawerOpen=false;renderDrawer()}markActivePane()}
},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(popEl){closePop();return}
    if(editingItem){editingItem=null;renderModal();return}
    if(descEditing){descEditing=false;renderModal();return}
    if(modalId){ACT.closeModal();return}
    if(drawerOpen){ACT.closeDrawer();return}
    if(archPage){ACT.closeArchive();return}
    if(composer){composer=null;renderAll();return}
    if(addingList){addingList=false;renderBoard();return}
    if(editingListTitle||editingBoardTitle){editingListTitle=null;editingBoardTitle=false;renderBoard();return}
  }
  const t=e.target;
  if(e.key==='Enter'&&!e.shiftKey){
    if(t.matches('[data-composer],#inboxAdd')){e.preventDefault();t.form.requestSubmit();return}
    if(t.id==='mTitle'){e.preventDefault();t.blur();return}
    if(t.matches('[data-list-title-input],[data-board-title-input]')){e.preventDefault();t.blur();return}
    if(t.matches('[data-ci-edit]')){e.preventDefault();t.blur();return}
    if(t.matches('[data-card]')){e.preventDefault();ACT.openCard(t.dataset.card);return}
    if(t.matches('.desc-view')){e.preventDefault();ACT.editDesc();return}
  }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){
    if(t.id==='descInput'){e.preventDefault();t.blur()}
    if(t.id==='commentInput'){e.preventDefault();t.form.requestSubmit()}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.composerForm){const id=f.dataset.composerForm;const t=f.querySelector('textarea');const v=t.value.trim();if(!v){t.focus();return}addCardTo(id,v);commit();const z=document.querySelector(`[data-list="${id}"] .cards`);z&&(z.scrollTop=z.scrollHeight);return}
  if(f.id==='inboxForm'){const t=$('#inboxAdd');const v=t.value.trim();if(!v)return;t.value='';addCardTo('inbox',v);commit();$('#inboxAdd').focus();return}
  if(f.dataset.addListForm){const bid=f.dataset.addListForm;const inp=f.querySelector('input');const v=inp.value.trim();if(!v){inp.focus();return}S.boards.find(b=>b.id===bid).lists.push({id:uid(),title:v,color:'none',collapsed:false,cards:[]});commit();const l=document.querySelector(`[data-lists="${bid}"]`);l.scrollLeft=l.scrollWidth;return}
  if(f.id==='qsForm'){const i=$('#qsInput');const v=i.value.trim();if(!v)return;i.value='';addQuickStep(v);fillQuickSteps();$('#qsInput').focus();return}
  if(f.id==='commentForm'){const t=$('#commentInput');const v=t.value.trim();if(!v)return;t.value='';locate(modalId).card.comments.push({id:uid(),text:v,at:Date.now()});commit();return}
  if(f.id==='clForm'){const c=locate(f.dataset.id).card;const t=$('#clTitle').value.trim()||'Actiestappen';const cl={id:uid(),title:t,items:[]};c.checklists.push(cl);closePop();pendingFocus='ciadd-'+cl.id;commit();return}
  if(f.dataset.ciAdd==='new'){const v=f.querySelector('input').value.trim();if(!v)return;const cl={id:uid(),title:'Actiestappen',items:[{id:uid(),text:v,done:false}]};locate(modalId).card.checklists.push(cl);pendingFocus='ciadd-'+cl.id;commit();return}
  if(f.dataset.ciAdd){const cl=locate(modalId).card.checklists.find(x=>x.id===f.dataset.ciAdd);const i=f.querySelector('input');const v=i.value.trim();if(!v)return;cl.items.push({id:uid(),text:v,done:false});pendingFocus='ciadd-'+cl.id;commit();return}
  if(f.id==='quickBoard'){const v=$('#quickBoardTitle').value.trim();if(!v)return;const b=mkBoard(v,'oceaan',['Te doen','Bezig','Klaar']);S.boards.push(b);closePop();ACT.goBoard(b.id);return}
  if(f.dataset.dayForm){const k=f.dataset.dayForm;const v=f.querySelector('input').value.trim();if(!v)return;addCardTo('inbox',v,{due:k});dayAdding=null;commit();toast('Kaart toegevoegd aan je Inbox');return}
});
document.addEventListener('change',e=>{

  if(t.dataset.qsToggle){const [clid,iid]=t.dataset.qsToggle.split(':');const it=locate(qsCard).card.checklists.find(x=>x.id===clid).items.find(i=>i.id===iid);it.done=t.checked;save();renderInbox();renderPlanner();renderBoard(true);fillQuickSteps();return}

  if(t.dataset.ciToggle){const [clid,iid]=t.dataset.ciToggle.split(':');const it=locate(modalId).card.checklists.find(x=>x.id===clid).items.find(i=>i.id===iid);it.done=t.checked;commit();return}
  if(t.dataset.labelName){const l=board().labels.find(x=>x.id===t.dataset.labelName);l.name=t.value.trim();save();renderInbox();renderPlanner();renderBoard(true);renderModal();return}

document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.id==='mTitle'){const c=locate(modalId)?.card;const v=t.value.trim();if(c&&v&&v!==c.title){c.title=v;commit()}else if(c)t.value=c.title;return}
  if(t.matches('[data-list-title-input]')){const f=findList(t.dataset.listTitleInput);const v=t.value.trim();if(f&&v)f.list.title=v;editingListTitle=null;commit();return}
  if(t.matches('[data-board-title-input]')){const v=t.value.trim();const b=S.boards.find(x=>x.id===t.dataset.boardTitleInput);if(v&&b)b.title=v;editingBoardTitle=false;commit();return}
  if(t.matches('[data-ci-edit]')){const [clid,iid]=t.dataset.ciEdit.split(':');const c=locate(modalId)?.card;const it=c&&c.checklists.find(x=>x.id===clid)?.items.find(i=>i.id===iid);const v=t.value.trim();if(it&&v)it.text=v;editingItem=null;commit();return}
  if(t.id&&t.id.startsWith('ciadd-')&&t.value.trim()){const f=t.form;setTimeout(()=>{if(document.body.contains(f)&&document.activeElement!==t&&!f.contains(document.activeElement))f.requestSubmit()},120);return}
  if(t.id==='descInput'){const c=locate(modalId)?.card;if(c){c.desc=t.value.trim()}setTimeout(()=>{if(descEditing&&document.activeElement!==$('#descInput')){descEditing=false;commit()}},120);return}
  if(t.matches('[data-composer]')){const lid=t.dataset.composer;setTimeout(()=>{const r=document.activeElement;if(composer!==lid||(r&&r.closest&&r.closest(`[data-composer-form="${lid}"]`)))return;
    const v=t.value.trim();composer=null;if(v&&findList(lid)){addCardTo(lid,v);commit()}else renderBoard()},120);return}
  if(t.matches('[data-day-input]')){setTimeout(()=>{if(!dayAdding)return;if(t.value.trim())t.form.requestSubmit();else{dayAdding=null;renderPlanner()}},120)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='archSearch'){archQ=t.value;fillArchive();return}
  if(t.id==='archBoardSel'){archBoard=t.value;fillArchive();return}
  if(t.id==='q'){q=t.value;renderInbox();renderPlanner();renderBoard();return}
  if(t.id==='mTitle'||t.id==='inboxAdd'||t.matches('[data-composer]'))autosize(t);
  // Edits are kept while typing, so nothing is lost when you click elsewhere or close the app.
  const v=t.value!=null?t.value.trim():'';
  if(t.id==='mTitle'){const c=locate(modalId)?.card;if(c&&v){c.title=v;autoSave(true)}return}
  if(t.id==='descInput'){const c=locate(modalId)?.card;if(c){c.desc=v;autoSave(true);const n=$('#descNote');n&&(n.textContent='Opgeslagen')}return}
  if(t.matches('[data-list-title-input]')){const f=findList(t.dataset.listTitleInput);if(f&&v){f.list.title=v;autoSave(false)}return}
  if(t.matches('[data-board-title-input]')){const b=S.boards.find(x=>x.id===t.dataset.boardTitleInput);if(b&&v){b.title=v;autoSave(false)}return}
  if(t.matches('[data-ci-edit]')){const [clid,iid]=t.dataset.ciEdit.split(':');const c=locate(modalId)?.card;const it=c&&c.checklists.find(x=>x.id===clid)?.items.find(i=>i.id===iid);if(it&&v){it.text=v;autoSave(false)}return}
  if(t.dataset.labelName){const l=S.boards.flatMap(b=>b.labels).find(x=>x.id===t.dataset.labelName);if(l){l.name=v;autoSave(false)}return}
});
let autoTimer=null;
// Saves right away; refreshes the cards behind an open card a moment after typing stops (never the field being typed in).
function autoSave(refresh){save();if(!refresh)return;clearTimeout(autoTimer);autoTimer=setTimeout(()=>{renderInbox();renderPlanner();renderBoard(true)},400)}
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{closePop();renderAll()},150)});

/* ---------- reorder action steps by dragging the grip ---------- */
let SORT=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');if(!g||e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  const row=g.closest('[data-item]');const cardId=row.closest('.pop')?qsCard:modalId;
  SORT={row,box:row.parentElement,cardId,pid:e.pointerId};
  row.classList.add('sorting');document.body.classList.add('sorting-steps');
},true);
document.addEventListener('pointermove',e=>{
  if(!SORT||e.pointerId!==SORT.pid)return;e.preventDefault();
  const sibs=[...SORT.box.querySelectorAll(':scope > [data-item]')].filter(r=>r!==SORT.row);
  let before=null;for(const r of sibs){const b=r.getBoundingClientRect();if(e.clientY<b.top+b.height/2){before=r;break}}
  if(before){if(SORT.row.nextElementSibling!==before)SORT.box.insertBefore(SORT.row,before)}
  else if(sibs.length&&sibs[sibs.length-1].nextElementSibling!==SORT.row)sibs[sibs.length-1].after(SORT.row);
});
function endSort(){
  const s=SORT;SORT=null;document.body.classList.remove('sorting-steps');s.row.classList.remove('sorting');
  const loc=locate(s.cardId);if(!loc)return;
  const cl=loc.card.checklists.find(x=>x.id===s.box.dataset.sort);if(!cl)return;
  const order=[...s.box.querySelectorAll(':scope > [data-item]')].map(r=>r.dataset.item.split(':')[1]);
  cl.items.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  save();renderInbox();renderPlanner();renderBoard(true);
  if(s.row.closest('.pop'))fillQuickSteps();else renderModal();
}
document.addEventListener('pointerup',e=>{if(SORT&&e.pointerId===SORT.pid)endSort()});
document.addEventListener('pointercancel',e=>{if(SORT&&e.pointerId===SORT.pid)endSort()});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-grip]'))e.preventDefault()},true);

/* ---------- files and Outlook mails dropped from outside the app ---------- */
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
function fileTarget(el){
  if(!el||!el.closest) return null;
  if(modalId&&el.closest('.modal')) return {kind:'card',id:modalId,el:el.closest('.modal')};
  if(modalId) return null;
  const c=el.closest('[data-card]');if(c) return {kind:'card',id:c.dataset.card,el:c};
  const d=el.closest('.day');if(d) return {kind:'day',id:d.querySelector('[data-drop]').dataset.drop.slice(4),el:d};
  const l=el.closest('.list[data-list]');if(l) return {kind:'list',id:l.dataset.list,el:l};
  const ip=el.closest('#inboxPanel');if(ip) return {kind:'inbox',el:ip};
  return null;
}
let hlEl=null,hlTimer=null;
function setHl(el){if(hlEl!==el){hlEl&&hlEl.classList.remove('drop-hl');hlEl=el;el&&el.classList.add('drop-hl')}clearTimeout(hlTimer);hlTimer=setTimeout(()=>setHl(null),200)}
document.addEventListener('dragover',e=>{
  if(!hasFiles(e)) return;
  e.preventDefault();const t=fileTarget(e.target);
  e.dataTransfer.dropEffect=t?'copy':'none';setHl(t&&t.el);
});
document.addEventListener('drop',async e=>{
  if(!hasFiles(e)) return;
  e.preventDefault();setHl(null);
  const t=fileTarget(e.target);if(!t) return;
  const files=[...e.dataTransfer.files];
  if(!files.length){toast('Er kwam geen bestand mee. Sleep de mail eerst naar je bureaublad en dan hierheen.');return}
  if(t.kind==='card'){addFiles(t.id,files);return}
  const title=await titleFromFiles(files);
  const c=addCardTo(t.kind==='list'?t.id:'inbox',title,t.kind==='day'?{due:t.id}:undefined);
  await addFiles(c.id,files);commit();
});

/* ---------- drag & drop (pointer based: mouse, pen and touch long-press) ---------- */
let P=null;
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||P) return;
  const t=e.target;
  if(t.closest('button,input,textarea,select,a,.modal,.pop,.drawer')) return;
  const cardEl=t.closest('[data-card]');
  const head=!cardEl&&t.closest('.list-head');
  if(!cardEl&&!head) return;
  P={x:e.clientX,y:e.clientY,row:t.closest('.lists'),el:cardEl||head.closest('.list'),type:cardEl?'card':'list',pid:e.pointerId,touch:e.pointerType==='touch',started:false};
  P.ready=!P.touch;
  if(P.touch) P.timer=setTimeout(()=>{if(P&&!P.started){P.ready=true;navigator.vibrate&&navigator.vibrate(15);beginDrag(P.x,P.y)}},320);
});
document.addEventListener('pointermove',e=>{
  if(!P||e.pointerId!==P.pid) return;
  if(!P.started){
    if(Math.hypot(e.clientX-P.x,e.clientY-P.y)<6) return;
    if(!P.ready){clearTimeout(P.timer);P=null;return}
    beginDrag(e.clientX,e.clientY);
  }
  moveDrag(e.clientX,e.clientY);
});
document.addEventListener('touchmove',e=>{if(P&&P.started){e.preventDefault();const t=e.touches[0];moveDrag(t.clientX,t.clientY)}},{passive:false});
document.addEventListener('pointerup',e=>{if(!P)return;clearTimeout(P.timer);if(P.started)endDrag();else P=null});
document.addEventListener('touchend',()=>{if(P&&P.started)endDrag()});
document.addEventListener('pointercancel',()=>{if(P&&!P.started){clearTimeout(P.timer);P=null}});
document.addEventListener('contextmenu',e=>{if(P&&P.touch)e.preventDefault()});

function beginDrag(x,y){
  const p=P;p.started=true;closePop();
  const el=p.el,r=el.getBoundingClientRect();
  p.offX=x-r.left;p.offY=y-r.top;
  const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';if(p.type==='list')g.style.height=Math.min(r.height,innerHeight*.7)+'px';g.style.overflow='hidden';
  document.body.appendChild(g);p.ghost=g;
  const ph=document.createElement('div');ph.className=p.type==='card'?'ph-card':'ph-list';
  ph.style.height=(p.type==='card'?r.height:r.height)+'px';
  el.after(ph);el.classList.add('drag-src');p.ph=ph;
  document.body.classList.add('dragging');
  p.raf=requestAnimationFrame(autoScroll);
  moveDrag(x,y);
}
function moveDrag(x,y){
  const p=P;if(!p||!p.started)return;p.lx=x;p.ly=y;
  p.ghost.style.transform=`translate(${x-p.offX}px,${y-p.offY}px) rotate(3deg)`;
  const under=document.elementFromPoint(x,y);if(!under)return;
  if(p.type==='card'){
    const box=$('#archiveBox');const onBox=!!under.closest('#archiveBox');box.classList.toggle('drop-on',onBox);p.toArchive=onBox;
    if(onBox)return;
    let zone=under.closest('[data-drop]');
    if(!zone){const l=under.closest('.list:not(.collapsed)');if(l)zone=l.querySelector('[data-drop]');else{const d=under.closest('.day');if(d)zone=d.querySelector('[data-drop]');else{const ip=under.closest('#inboxPanel');if(ip)zone=ip.querySelector('[data-drop]')}}}
    if(!zone)return;
    const kids=[...zone.querySelectorAll(':scope > [data-card]:not(.drag-src)')];
    let before=null;for(const k of kids){const r=k.getBoundingClientRect();if(y<r.top+r.height/2){before=k;break}}
    if(before){if(p.ph.nextElementSibling!==before)zone.insertBefore(p.ph,before)}else if(zone.lastElementChild!==p.ph)zone.appendChild(p.ph);
    p.zone=zone;
  }else{
    const row=p.row;
    const ls=[...row.querySelectorAll(':scope > .list:not(.drag-src)')];
    const stacked=row.classList.contains('layout-kolom');
    let before=null;for(const l of ls){const r=l.getBoundingClientRect();
      if(stacked?y<r.top+r.height/2:(y<r.top||(y<=r.bottom&&x<r.left+r.width/2))){before=l;break}}
    const tgt=before||row.querySelector(':scope > .add-list');if(p.ph.nextElementSibling!==tgt)row.insertBefore(p.ph,tgt);
  }
}
function autoScroll(){
  if(!P||!P.started)return;
  const x=P.lx,y=P.ly,E=60,sp=14;
  const hit=document.elementFromPoint(x,y);const row=(P.type==='list'?P.row:hit&&hit.closest('.lists'))||P.row;
  const r=row?row.getBoundingClientRect():{top:0,bottom:-1};
  if(row&&y>r.top&&y<r.bottom){if(x>r.right-E)row.scrollLeft+=sp;else if(x<r.left+E)row.scrollLeft-=sp}
  if(row&&x>r.left&&x<r.right&&row.scrollHeight>row.clientHeight){if(y>r.bottom-E)row.scrollTop+=sp;else if(y<r.top+E)row.scrollTop-=sp}
  if(P.type==='card'&&P.zone){const sc=P.zone.closest('.cards,.panel-body')||P.zone;const zr=sc.getBoundingClientRect();if(y>zr.bottom-E&&y<zr.bottom+20)sc.scrollTop+=sp;else if(y<zr.top+E&&y>zr.top-20)sc.scrollTop-=sp}
  P.raf=requestAnimationFrame(autoScroll);
}
function endDrag(){
  const p=P;P=null;cancelAnimationFrame(p.raf);
  const ph=p.ph;
  let n=ph.nextElementSibling;while(n&&n.classList.contains('drag-src'))n=n.nextElementSibling;
  if(p.type==='card'){
    const zone=ph.parentElement&&ph.parentElement.closest('[data-drop]');const drop=zone&&zone.dataset.drop;const id=p.el.dataset.card;
    $('#archiveBox').classList.remove('drop-on');
    if(p.toArchive){archiveCard(id)}
    else if(drop&&drop.startsWith('day:')){const c=locate(id).card;const k=drop.slice(4);if(c.due!==k){c.due=k;log(c,`heeft de vervaldatum ingesteld op ${fmtDue(k)}`)}}
    else if(drop){
      // a card dragged from the planner onto the board moves; dropping it back where it came from is a no-op
      const nid=n&&n.dataset&&n.dataset.card||null;
      if(p.el.nextElementSibling!==ph) moveCard(id,drop,nid);
    }
  }else{
    const b=S.boards.find(x=>x.id===p.row.dataset.lists);const id=p.el.dataset.list;const i=b.lists.findIndex(l=>l.id===id);const [l]=b.lists.splice(i,1);
    const nid=n&&n.dataset&&n.dataset.list;const j=nid?b.lists.findIndex(x=>x.id===nid):-1;
    if(j<0)b.lists.push(l);else b.lists.splice(j,0,l);
  }
  p.ghost.remove();ph.remove();p.el.classList.remove('drag-src');document.body.classList.remove('dragging');
  justDragged=true;setTimeout(()=>justDragged=false,50);
  commit();
}

renderAll();
})();
</script>
<script>
// App-functies: offline werken en een knop "Installeren" zodra de browser dat aanbiedt.
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(function(){
  let deferred=null;
  const btn=document.createElement('button');
  btn.className='btn';btn.hidden=true;btn.textContent='Installeren';btn.title='Planbord als app installeren';
  document.querySelector('.top .btn.primary').before(btn);
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false});
  btn.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;btn.hidden=true});
  addEventListener('appinstalled',()=>{btn.hidden=true});
})();
</script>
